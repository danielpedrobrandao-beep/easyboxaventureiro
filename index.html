function sha256(str){var K=[],H=[],p=2,n=0,i,j;var rot=(x,r)=>x>>>r|x<<32-r;for(;n<64;p++){for(j=2;j*j<=p&&p%j;j++);if(j*j>p){if(n<8)H[n]=Math.pow(p,.5)*4294967296|0;K[n++]=Math.pow(p,1/3)*4294967296|0}}

var A=h[0],B=h[1],C=h[2],D=h[3],E=h[4],F=h[5],G=h[6],Hh=h[7];for(i=0;i<64;i++){var t1=(Hh+(rot(E,6)^rot(E,11)^rot(E,25))+(E&F^~E&G)+K[i]+w[i])|0,t2=((rot(A,2)^rot(A,13)^rot(A,22))+(A&B^A&C^B&C))|0;Hh=G;G=F;F=E;E=D+t1|0;D=C;C=B;B=A;A=t1+t2|0}
H[0]=H[0]+A|0;H[1]=H[1]+B|0;H[2]=H[2]+C|0;H[3]=H[3]+D|0;H[4]=H[4]+E|0;H[5]=H[5]+F|0;H[6]=H[6]+G|0;H[7]=H[7]+Hh|0;if(o>0){}}
return H.map(x=>("00000000"+(x>>>0).toString(16)).slice(-8)).join("")}
